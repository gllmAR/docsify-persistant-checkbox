<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>docsify-plugin-persistent-checkbox</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/themes/vue.css" />
</head>
<body>
  <div id="app">Loading…</div>

  <script>
    window.$docsify = {
      name: 'persistent-checkbox demo',
      repo: 'https://github.com/gllmar/docsify-persistant-checkbox',
      loadSidebar: true,
      subMaxLevel: 2,
      // single-line usage works with no config at all; everything below is
      // optional customization (or `persistentCheckbox: false` to disable):
      persistentCheckbox: {
        onChange(ctx) {
          console.log('[demo] onChange', ctx);
        },
        onPageComplete(ctx) {
          console.log('[demo] page complete!', ctx);
        },
      },
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5"></script>
  <!-- plugin via our GitHub Pages upstream (CDN-like) -->
  <script src="https://gllmar.github.io/docsify-persistant-checkbox/docsify-plugin-persistent-checkbox.js"></script>
</body>
</html>
